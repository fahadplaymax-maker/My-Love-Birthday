<body data-page="timer" class="timer-only">
  <div class="timer-ambient" aria-hidden="true">
    <span class="ambient-orb orb-a"></span>
    <span class="ambient-orb orb-b"></span>
    <span class="ambient-orb orb-c"></span>
    <span class="timer-sparkle ts1">?</span>
    <span class="timer-sparkle ts2">?</span>
    <span class="timer-sparkle ts3">?</span>
    <span class="timer-sparkle ts4">?</span>
    <span class="timer-sparkle ts5">?</span>
    <span class="timer-sparkle ts6">?</span>
  </div>

  <main class="timer-only-shell" aria-label="Birthday countdown">
    <p class="timer-kicker">A little surprise for Huma ??</p>
    <h1 class="timer-heading">Your special day is almost here...</h1>
    <p class="timer-sub">Every moment is bringing you closer to your birthday surprise, Huma ?</p>
    <p class="timer-date-pill">?? 29 November 2026</p>

    <div class="countdown-timer" id="countdownTimer" aria-live="polite">
      <div class="timer-box"><span id="t-days">--</span><small>Days</small></div>
      <div class="timer-box"><span id="t-hours">--</span><small>Hours</small></div>
      <div class="timer-box"><span id="t-minutes">--</span><small>Minutes</small></div>
      <div class="timer-box timer-seconds"><span id="t-seconds">--</span><small>Seconds</small></div>
    </div>
  </main>
