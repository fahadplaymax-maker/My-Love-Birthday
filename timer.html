<body data-page="timer" class="timer-only">
  <main class="timer-only-shell" aria-label="Birthday countdown">
    <p class="timer-kicker">A little surprise for Huma 💗</p>
    <h1 class="timer-heading">Tumhara khaas din bas qareeb hai...</h1>
    <p class="timer-sub">Har lamha tumhein tumhare birthday surprise ke aur qareeb la raha hai, Huma ✨</p>

    <div class="countdown-timer" id="countdownTimer" aria-live="polite">
      <div class="timer-box"><span id="t-days">--</span><small>Days</small></div>
      <div class="timer-box"><span id="t-hours">--</span><small>Hours</small></div>
      <div class="timer-box"><span id="t-minutes">--</span><small>Minutes</small></div>
      <div class="timer-box"><span id="t-seconds">--</span><small>Seconds</small></div>
    </div>
  </main>
