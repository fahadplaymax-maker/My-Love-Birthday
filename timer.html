  <title>Step 1 ⏳ | Huma's Birthday Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=19" />
  <script src="timer.js?v=7" defer></script>
</head>
<body data-page="timer" class="timer-only">
  <div class="timer-ambient" aria-hidden="true">
    <div class="timer-aurora"></div>
    <span class="ambient-orb orb-a"></span>
    <span class="ambient-orb orb-b"></span>
    <span class="ambient-orb orb-c"></span>
    <div class="timer-stars" id="timerStars"></div>
    <div class="timer-floaters" id="timerFloaters"></div>
  </div>

  <main class="timer-only-shell timer-reveal" aria-label="Birthday countdown">
    <p class="timer-kicker"><span class="kicker-dot"></span>A little surprise for Huma <span class="kicker-heart">💗</span></p>
    <h1 class="timer-heading"><span class="heading-shimmer">Your special day is almost here...</span></h1>
    <p class="timer-sub">Every second is bringing you closer to something beautiful, Huma ✨</p>
    <p class="timer-date-pill"><span class="pill-icon">🎂</span> 29 November 2026 <span class="pill-icon">✨</span></p>

    <div class="countdown-timer" id="countdownTimer" aria-live="polite">
      <div class="timer-box" style="--d:0ms">
        <div class="timer-box-glow"></div>
        <span id="t-days">--</span>
        <small>Days</small>
      </div>
      <div class="timer-box" style="--d:100ms">
        <div class="timer-box-glow"></div>
        <span id="t-hours">--</span>
        <small>Hours</small>
      </div>
      <div class="timer-box" style="--d:200ms">
        <div class="timer-box-glow"></div>
        <span id="t-minutes">--</span>
        <small>Minutes</small>
      </div>
      <div class="timer-box timer-seconds" style="--d:300ms">
        <div class="timer-box-glow"></div>
        <span id="t-seconds">--</span>
        <small>Seconds</small>
      </div>
    </div>

    <p class="timer-tease" id="timerTease"><span class="tease-pulse"></span>Something magical is waiting for you...</p>
  </main>
</body>
</html>
