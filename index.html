    .entry-card {
      background: rgba(255, 255, 255, 0.8);

      border: 1px solid #fff;
      border-radius: 24px;

    .entry-card h1 { color: var(--ink); font-size: clamp(1.6rem, 5vw, 2.2rem); }
    .entry-card p { color: var(--ink-light); margin: 14px 0 24px; }
